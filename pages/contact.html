<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Formulir</title>

    <style>
        body {
            margin: 0;
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            margin: 0px auto;
            padding: 24px;
            border: 1px solid #d4d4d4;
            border-radius: 8px;
        }

        .contact-form h2 {
            text-align: center;
            margin-top: 0;
            font-size: 20px;
            color: darkblue;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #d4d4d4;
            border-radius: 4px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1a3b5d;
            background-color: #f0f4f8;
        }
        
        .btn-submit {
            background-color: #1a3b5d;
            width: 40%;
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            border: none;
        }

        .btn-submit:hover {
            background-color: #0f253d;
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea name="pesan" id="pesan" rows="4"></textarea>
            </div>

            <button class="btn-submit" type="submit">Kirim Pesan</button>
        </form>
    </section>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
