<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Hobi</title>

    <style>
        /* 320px + 40px padding + 4px border = 364px */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #1e2e49;
            margin: 30px auto;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }

        .card h3 {
            color: #1e2e49;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: #e5872e;
            font-size: 15px;
        }

        footer {
            text-align: center;
        }

    </style>

</head>
<body>
    <main>
        <div class="card">
            <img src="/assets/images/futsal.jpg" alt="Kegiatan Futsal">
            <h3>Hobi Saya</h3>
            <p>Futsal adalah hobi saya. Saya rutin bermain futsal bersama teman-teman untuk menjaga kebugaran tubuh dan melatih kerja sama tim.</p>
            <a href="#">Lihat Saya Bermain</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
