<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Set</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: whitesmoke;
        }

        h2 {
            font-size: 20px;
            color: navy;
        }

        .link {
            display: inline-block;
            margin-top: 35px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
        }

        .button-group .btn {
            margin-bottom: 10px;
            margin-right: 10px;
        }

        .button-group {
            display: flex;
        }

        .btn-primary {
            background-color:rgb(0, 38, 103);
            color: white;
        }

        .btn-secondary {
            background-color: rgb(220, 229, 240);
        }

        .btn-outline {
            background-color: white;
            border: 2px solid #1b2d4d;
        }

        .btn-send {
            background-color: rgba(233, 149, 60, 1);
            color: white;
        }

        .btn-secondary, .btn-outline {
            color: darkblue;
        }

        .btn-primary:hover {
            background-color: #4169a1;
        }

        .btn-secondary:hover {
            background-color: #7189aa;
            color: white;
        }

        .btn-outline:hover {
            background-color: #263b5e;
            color: white
        }

        .btn-send:hover {
            background-color: rgb(196, 109, 29);
        }
    </style>
</head>

<body>
    <main>
        <h2>Normal</h2>

        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Projek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>

        <h2>Hover (dipaksa agar terlihat di screenshot)</h2>

        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihay Projek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirm Pesan</a>

        </div>
    </main>

    <footer>
        <a href="../index.html" class="link">Kembali ke Beranda</a>
    </footer>

</body>
</html>
